name: TestFlight

# Builds, signs and uploads the visionOS client to TestFlight. Run it by hand (Actions > TestFlight > Run workflow).
# One-time setup (secrets, variables, the App Store Connect app record): docs/TESTFLIGHT.md.
#
# Signing is automatic and cloud-managed: Xcode creates/fetches the distribution certificate and the provisioning
# profile with the App Store Connect API key. An Apple ID and password cannot be used in CI (two-factor).

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App version shown in TestFlight (CFBundleShortVersionString)"
        default: "1.3.10"
      low_latency_streaming:
        description: "Include the low-latency-streaming entitlement (untick if signing complains about it)"
        type: boolean
        default: true
      unsigned_check:
        description: "Only check that the Release archive builds (no signing, no secrets needed, nothing is uploaded)"
        type: boolean
        default: false
      public_link:
        description: "After the upload: add the build to the external group named below, enable its public link, submit the build for Beta App Review and print the link"
        type: boolean
        default: false
      existing_build:
        description: "Build number already uploaded (e.g. 21): skip archive and upload, only do the public link step for that build"
        default: ""
      invite_testers:
        description: "Internal testers to invite, separated by ';' as email:First Last (e.g. a@b.com:Ann Lee). Only this runs: no build. People must accept the App Store Connect invitation, then run again to add them to the group"
        default: ""
      public_group_name:
        description: "Name of the external TestFlight group that carries the public link (created if missing)"
        default: "Public"
      expire_versions:
        description: "Marketing versions whose builds are expired in TestFlight, separated by ',' (e.g. 1.4). Only this runs: no build. Then the newest valid build of marketing_version (or existing_build) is added to the internal groups, and the builds testers can install are listed"
        default: ""
      revoke_ci_certificates:
        description: "First revoke the certificates earlier runs created on the team ('Created via API'): tick when signing says the account has reached the maximum number of certificates"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    if: ${{ inputs.existing_build == '' && inputs.invite_testers == '' && inputs.expire_versions == '' }}
    runs-on: xcode-27   # needs the visionOS 27 SDK (GCControllerHomeButtonSettingsManager); the standard macos-26 image only has Xcode 26.6 (checked 2026-11-04)
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - name: Check configuration
        if: ${{ !inputs.unsigned_check }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID BUNDLE_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing configuration:$missing. Secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and variables APPLE_TEAM_ID, BUNDLE_ID: see docs/TESTFLIGHT.md"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Toolchain versions
        run: |
          xcodebuild -version
          rustc --version

      - name: Rust target and cbindgen
        run: |
          rustup target add aarch64-apple-ios
          brew install cbindgen

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ALVR/target
          key: cargo-${{ runner.os }}-${{ hashFiles('ALVR/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build client core and xcframework
        run: |
          unset SDKROOT
          rm -rf ALVR/build ALVR/alvr/server
          bash scripts/apply_core_patches.sh
          CARGO_TARGET_DIR=ALVR/target cargo build --manifest-path ALVR/Cargo.toml \
            --target=aarch64-apple-ios -p alvr_client_core --profile distribution
          mkdir -p ALVR/build
          (cd ALVR/alvr/client_core && cbindgen --config cbindgen.toml --crate alvr_client_core --output ../../build/alvr_client_core.h)
          sh repack_alvr_client.sh

      # The Metal toolchain is not preinstalled on the runner image.
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: App Store Connect API key
        if: ${{ !inputs.unsigned_check }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Entitlements
        run: |
          mkdir -p build
          cp ALVRClient/ALVRClient.entitlements build/AirFrameXR.entitlements
          if [ "${{ inputs.low_latency_streaming }}" != "true" ]; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.low-latency-streaming" build/AirFrameXR.entitlements
          fi
          cat build/AirFrameXR.entitlements

      - name: Revoke the certificates earlier runs created
        if: ${{ !inputs.unsigned_check && inputs.revoke_ci_certificates }}
        run: |
          # Automatic signing mints a certificate per fresh runner and Apple caps their number ("Choose a certificate to revoke. Your account has
          # reached the maximum number of certificates"). The App Store Connect API key the build already uses can list and revoke them; only the
          # ones Xcode created through the API are touched (display name "Created via API"), never a certificate made by hand on a Mac.
          # the runner's Python is Homebrew's, marked externally managed (PEP 668): the machine is thrown away after the run, so install into it
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, jwt
          key = open(os.environ["ASC_KEY_PATH"]).read()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + tok})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else {}
          certs = call("GET", "https://api.appstoreconnect.apple.com/v1/certificates?limit=200").get("data", [])
          print(f"{len(certs)} certificate(s) on the team:")
          for c in certs:
              a = c["attributes"]
              print(f"  {c['id']}  {a.get('certificateType'):22s} {a.get('displayName')!s:40s} {a.get('name')!s:48s} expires {str(a.get('expirationDate'))[:10]}")
          mine = [c for c in certs if "created via api" in (str(c["attributes"].get("displayName", "")) + str(c["attributes"].get("name", ""))).lower()]
          if not mine:
              print("::warning::no certificate created through the API found; nothing revoked (revoke by hand at developer.apple.com if signing still fails)")
          for c in mine:
              call("DELETE", "https://api.appstoreconnect.apple.com/v1/certificates/" + c["id"])
              print("revoked", c["id"], c["attributes"].get("certificateType"), c["attributes"].get("displayName"))
          PY

      - name: Archive (unsigned check)
        if: ${{ inputs.unsigned_check }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ALVRClient.xcodeproj -scheme ALVRClient -configuration Release \
            -destination 'generic/platform=visionOS' \
            -archivePath build/AirFrameXR.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=check.airframexr.client \
            CODE_SIGN_ENTITLEMENTS="$PWD/build/AirFrameXR.entitlements" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee build/archive.log
          APP=build/AirFrameXR.xcarchive/Products/Applications/ALVRClient.app
          test -d "$APP"
          PB=/usr/libexec/PlistBuddy
          echo "bundle id:  $($PB -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "display:    $($PB -c 'Print :CFBundleDisplayName' "$APP/Info.plist")"
          echo "version:    $($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($($PB -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          test "$($PB -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "check.airframexr.client"
          if [ -d "$APP/PlugIns" ]; then echo "::error::an extension is still embedded"; exit 1; fi
          ls "$APP" | head -30
          test -f "$APP/Assets.car"

      - name: Archive
        if: ${{ !inputs.unsigned_check }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ALVRClient.xcodeproj -scheme ALVRClient -configuration Release \
            -destination 'generic/platform=visionOS' \
            -archivePath build/AirFrameXR.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS="$PWD/build/AirFrameXR.entitlements" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee build/archive.log

      - name: Export and upload to TestFlight
        if: ${{ !inputs.unsigned_check }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/AirFrameXR.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore

  public-link:
    name: Public TestFlight link
    needs: testflight
    if: ${{ !cancelled() && inputs.public_link && !inputs.unsigned_check && (needs.testflight.result == 'success' || needs.testflight.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.existing_build || github.run_number }}
      GROUP_NAME: ${{ inputs.public_group_name }}
      # Test Information that Beta App Review requires (repository variables, optional: unset = left as it is in App Store Connect)
      BETA_DESCRIPTION: ${{ vars.BETA_DESCRIPTION }}
      BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
      BETA_CONTACT_FIRST: ${{ secrets.BETA_CONTACT_FIRST }}
      BETA_CONTACT_LAST: ${{ secrets.BETA_CONTACT_LAST }}
      BETA_CONTACT_PHONE: ${{ secrets.BETA_CONTACT_PHONE }}
      BETA_CONTACT_EMAIL: ${{ secrets.BETA_CONTACT_EMAIL }}
    steps:
      - name: Public link
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          # Uses the same App Store Connect API key as the upload (role Admin or App Manager). Idempotent: an existing group is reused.
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request, jwt
          E = os.environ
          key = open(E["ASC_KEY_PATH"]).read()
          def token():
              return jwt.encode({"iss": E["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": E["ASC_KEY_ID"]})
          def call(method, path, body=None, ok_errors=()):
              url = path if path.startswith("http") else "https://api.appstoreconnect.apple.com" + path
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={"Authorization": "Bearer " + token(), "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode()[:1500]
                  if e.code in ok_errors:
                      print(f"::warning::{method} {path} -> {e.code}: {detail}")
                      return None
                  print(f"::error::{method} {path} -> {e.code}: {detail}")
                  sys.exit(1)
          q = urllib.parse.quote
          app = call("GET", f"/v1/apps?filter[bundleId]={q(E['BUNDLE_ID'])}")["data"]
          if not app:
              print("::error::no app record with this bundle id"); sys.exit(1)
          app_id = app[0]["id"]
          # the uploaded build appears after processing (10 to 20 minutes)
          build = None
          for i in range(60):
              r = call("GET", f"/v1/builds?filter[app]={app_id}&filter[version]={E['BUILD_NUMBER']}&filter[preReleaseVersion.version]={q(E['MARKETING_VERSION'])}&limit=1")["data"]
              if r:
                  build = r[0]
                  st = build["attributes"].get("processingState")
                  print(f"build {E['MARKETING_VERSION']} ({E['BUILD_NUMBER']}): {st}")
                  if st == "VALID":
                      break
                  if st in ("FAILED", "INVALID"):
                      print("::error::build processing failed"); sys.exit(1)
              else:
                  print("build not visible yet")
              time.sleep(30)
          else:
              print("::error::build did not finish processing in 30 minutes"); sys.exit(1)
          bid = build["id"]
          # group
          groups = call("GET", f"/v1/apps/{app_id}/betaGroups?limit=200")["data"]
          grp = next((g for g in groups if g["attributes"]["name"] == E["GROUP_NAME"] and not g["attributes"].get("isInternalGroup")), None)
          if grp is None:
              grp = call("POST", "/v1/betaGroups", {"data": {"type": "betaGroups",
                  "attributes": {"name": E["GROUP_NAME"], "publicLinkEnabled": True, "publicLinkLimitEnabled": False, "feedbackEnabled": True},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}})["data"]
              print("created group", grp["id"])
          elif not grp["attributes"].get("publicLinkEnabled"):
              grp = call("PATCH", f"/v1/betaGroups/{grp['id']}", {"data": {"type": "betaGroups", "id": grp["id"], "attributes": {"publicLinkEnabled": True, "publicLinkLimitEnabled": False}}})["data"]
          gid = grp["id"]
          call("POST", f"/v1/betaGroups/{gid}/relationships/builds", {"data": [{"type": "builds", "id": bid}]}, ok_errors=(409,))
          # Test Information: description + feedback email (localization) and the review contact
          if E.get("BETA_DESCRIPTION"):
              attrs = {"description": E["BETA_DESCRIPTION"]}
              if E.get("BETA_FEEDBACK_EMAIL"):
                  attrs["feedbackEmail"] = E["BETA_FEEDBACK_EMAIL"]
              locs = call("GET", f"/v1/apps/{app_id}/betaAppLocalizations")["data"]
              loc = next((l for l in locs if l["attributes"]["locale"].startswith("en")), None)
              if loc:
                  call("PATCH", f"/v1/betaAppLocalizations/{loc['id']}", {"data": {"type": "betaAppLocalizations", "id": loc["id"], "attributes": attrs}})
              else:
                  call("POST", "/v1/betaAppLocalizations", {"data": {"type": "betaAppLocalizations", "attributes": dict(attrs, locale="en-US"),
                      "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}})
              print("beta app description set")
          contact = {k: E[v] for k, v in (("contactFirstName", "BETA_CONTACT_FIRST"), ("contactLastName", "BETA_CONTACT_LAST"), ("contactPhone", "BETA_CONTACT_PHONE"), ("contactEmail", "BETA_CONTACT_EMAIL")) if E.get(v)}
          if contact:
              det = call("GET", f"/v1/apps/{app_id}/betaAppReviewDetail")["data"]
              call("PATCH", f"/v1/betaAppReviewDetails/{det['id']}", {"data": {"type": "betaAppReviewDetails", "id": det["id"], "attributes": dict(contact, demoAccountRequired=False)}})
              print("beta review contact set")
          # Beta App Review (needed once per version for external testers). Needs contact details in App Store Connect > TestFlight > Test Information.
          call("POST", "/v1/betaAppReviewSubmissions", {"data": {"type": "betaAppReviewSubmissions", "relationships": {"build": {"data": {"type": "builds", "id": bid}}}}}, ok_errors=(409, 422))
          grp = call("GET", f"/v1/betaGroups/{gid}")["data"]
          link = grp["attributes"].get("publicLink")
          rev = call("GET", f"/v1/builds/{bid}/betaAppReviewSubmission", ok_errors=(404,))
          state = rev["data"]["attributes"].get("betaReviewState") if rev and rev.get("data") else "none"
          print(f"Beta App Review state: {state}")
          print(f"PUBLIC LINK: {link}")
          with open(E["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### TestFlight public link\n\n{link}\n\nBeta App Review: {state}. The link installs the build once Apple has approved it (first build of a version).\n")
          PY

  expire-builds:
    name: Expire builds
    if: ${{ inputs.expire_versions != '' && !inputs.unsigned_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      EXPIRE_VERSIONS: ${{ inputs.expire_versions }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.existing_build }}
    steps:
      - name: Expire the listed versions, publish the current one
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request, jwt
          E = os.environ
          key = open(E["ASC_KEY_PATH"]).read()
          def call(method, path, body=None, ok_errors=()):
              tok = jwt.encode({"iss": E["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": E["ASC_KEY_ID"]})
              url = path if path.startswith("http") else "https://api.appstoreconnect.apple.com" + path
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, method=method, headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode()[:1200]
                  if e.code in ok_errors:
                      print(f"::warning::{method} {path} -> {e.code}: {detail}")
                      return None
                  print(f"::error::{method} {path} -> {e.code}: {detail}")
                  sys.exit(1)
          q = urllib.parse.quote
          app_id = call("GET", f"/v1/apps?filter[bundleId]={q(E['BUNDLE_ID'])}")["data"][0]["id"]
          def builds(version):
              return call("GET", f"/v1/builds?filter[app]={app_id}&filter[preReleaseVersion.version]={q(version)}&limit=200")["data"]
          for v in [x.strip() for x in E["EXPIRE_VERSIONS"].split(",") if x.strip()]:
              if v == E["MARKETING_VERSION"]:
                  print(f"::error::refusing to expire the current version {v}"); sys.exit(1)
              for b in builds(v):
                  a = b["attributes"]
                  if a.get("expired"):
                      print(f"{v} ({a['version']}): already expired"); continue
                  call("PATCH", f"/v1/builds/{b['id']}", {"data": {"type": "builds", "id": b["id"], "attributes": {"expired": True}}})
                  print(f"{v} ({a['version']}): expired")
          cur = [b for b in builds(E["MARKETING_VERSION"]) if b["attributes"].get("processingState") == "VALID" and not b["attributes"].get("expired")]
          if E.get("BUILD_NUMBER"):
              cur = [b for b in cur if b["attributes"]["version"] == E["BUILD_NUMBER"]]
          if not cur:
              print(f"::error::no valid {E['MARKETING_VERSION']} build (still processing?)"); sys.exit(1)
          cur.sort(key=lambda b: int(b["attributes"]["version"]))
          newest = cur[-1]
          print(f"current: {E['MARKETING_VERSION']} ({newest['attributes']['version']})")
          for g in call("GET", f"/v1/apps/{app_id}/betaGroups?limit=200")["data"]:
              if g["attributes"].get("isInternalGroup"):
                  call("POST", f"/v1/betaGroups/{g['id']}/relationships/builds", {"data": [{"type": "builds", "id": newest["id"]}]}, ok_errors=(409, 422))
                  print("added to internal group", g["attributes"]["name"])
          print("builds still installable:")
          allb = call("GET", f"/v1/builds?filter[app]={app_id}&include=preReleaseVersion&sort=-uploadedDate&limit=30")
          pv = {i["id"]: i["attributes"]["version"] for i in allb.get("included", []) if i["type"] == "preReleaseVersions"}
          for b in allb["data"]:
              a = b["attributes"]
              if not a.get("expired"):
                  print(" ", pv.get(b["relationships"]["preReleaseVersion"]["data"]["id"]), f"({a['version']})", a.get("processingState"))
          PY

  invite-testers:
    name: Invite internal testers
    if: ${{ inputs.invite_testers != '' && !inputs.unsigned_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      INVITES: ${{ inputs.invite_testers }}
    steps:
      - name: Invite and add to the internal group
        run: |
          # Internal testers must be App Store Connect users first (role Marketing, limited to this app). Step 1 invites them, they accept by email,
          # step 2 (this same run, next time) adds accepted users to the internal group. Safe to repeat. The key needs the Admin role.
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/key.p8"
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request, jwt
          E = os.environ
          key = open(E["ASC_KEY_PATH"]).read()
          def call(method, path, body=None, ok_errors=()):
              tok = jwt.encode({"iss": E["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": E["ASC_KEY_ID"]})
              url = "https://api.appstoreconnect.apple.com" + path
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, method=method, headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode()[:1200]
                  if e.code in ok_errors:
                      print(f"::warning::{method} {path} -> {e.code}: {detail}")
                      return None
                  print(f"::error::{method} {path} -> {e.code}: {detail}")
                  sys.exit(1)
          q = urllib.parse.quote
          app_id = call("GET", f"/v1/apps?filter[bundleId]={q(E['BUNDLE_ID'])}")["data"][0]["id"]
          groups = call("GET", f"/v1/apps/{app_id}/betaGroups?limit=200")["data"]
          grp = next((g for g in groups if g["attributes"].get("isInternalGroup")), None)
          if grp is None:
              grp = call("POST", "/v1/betaGroups", {"data": {"type": "betaGroups", "attributes": {"name": "Internal", "isInternalGroup": True, "hasAccessToAllBuilds": True},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}})["data"]
              print("created internal group", grp["id"])
          gid = grp["id"]
          for item in E["INVITES"].split(";"):
              item = item.strip()
              if not item:
                  continue
              email, _, name = item.partition(":")
              email = email.strip().lower()
              first, _, last = name.strip().partition(" ")
              if not (email and first and last.strip()):
                  print(f"::error::'{item}': expected email:First Last"); sys.exit(1)
              users = call("GET", f"/v1/users?filter[username]={q(email)}")["data"]
              if users:
                  r = call("POST", "/v1/betaTesters", {"data": {"type": "betaTesters", "attributes": {"email": email, "firstName": first, "lastName": last.strip()},
                      "relationships": {"betaGroups": {"data": [{"type": "betaGroups", "id": gid}]}}}}, ok_errors=(409,))
                  print(f"{email}: user on the team, added to the internal group" if r is not None else f"{email}: already a tester (or see warning)")
                  continue
              pend = call("GET", f"/v1/userInvitations?filter[email]={q(email)}")["data"]
              if pend:
                  print(f"{email}: invitation already sent, waiting for them to accept")
                  continue
              call("POST", "/v1/userInvitations", {"data": {"type": "userInvitations", "attributes": {"email": email, "firstName": first, "lastName": last.strip(), "roles": ["MARKETING"], "allAppsVisible": False, "provisioningAllowed": False},
                  "relationships": {"visibleApps": {"data": [{"type": "apps", "id": app_id}]}}}})
              print(f"{email}: invitation sent (role Marketing, this app only). After they accept, run again to add them to the group")
          PY
